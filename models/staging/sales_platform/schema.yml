version: 2

sources:
  - name: sales_platform
    database: mdlpoclanding_catalog
    schema: sales_platform
    tables:
      - name: customers
      - name: orders
      - name: payments

models:
  - name: stg_sales_platform__customers
    description: "Staging model for customer data from sales platform"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - unique
          - not_null

      - name: email
        description: "Customer email address"
        tests:
          - not_null
          - unique

      - name: first_name
        description: "Customer first name"
        tests:
          - not_null

      - name: last_name
        description: "Customer last name"
        tests:
          - not_null

      - name: created_at
        description: "Timestamp when customer record was created"
        tests:
          - not_null

  - name: stg_sales_platform__orders
    description: "Staging model for order data from sales platform"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key to customers table"
        tests:
          - not_null
          - relationships:
              to: ref('stg_sales_platform__customers')
              field: customer_id

      - name: order_date
        description: "Date when order was placed"
        tests:
          - not_null

      - name: total_amount
        description: "Total order amount including tax and shipping"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: stg_sales_platform__payments
    description: "Staging model for payment data from sales platform"
    columns:
      - name: payment_id
        description: "Unique identifier for each payment"
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key to orders table"
        tests:
          - not_null
          - relationships:
              to: ref('stg_sales_platform__orders')
              field: order_id

      - name: payment_amount
        description: "Amount of the payment"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: payment_status
        description: "Status of the payment"
        tests:
          - not_null
          - accepted_values:
              values: ['pending', 'completed', 'failed', 'refunded']
version: 2
models:
  - name: fct_orders
    description: "Fact table containing all order transactions with enriched payment and customer 
information"
    columns:
      - name: order_id
        description: "Primary key - unique identifier for each order"
        tests:
          - unique
          - not_null
      
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      
      - name: total_amount


        description: "Total order amount"
        tests:
          - not_null
      
      - name: payment_status_derived
        description: "Derived payment status based on amounts paid"
        tests:
          - accepted_values:
              values: ['fully_paid', 'partially_paid', 'unpaid']
  - name: dim_customers
    description: "Dimension table containing customer attributes and lifetime metrics"
    columns:
      - name: customer_id
        description: "Primary key - unique identifier for each customer"
        tests:
          - unique
          - not_null
      
      - name: email
        description: "Customer email address"
        tests:
          - unique
          - not_null
      
      - name: customer_segment
        description: "Customer segmentation based on order frequency"
        tests:
          - accepted_values:
              values: ['prospect', 'one_time', 'repeat', 'loyal']
      
      - name: value_segment
        description: "Customer segmentation based on lifetime value"
        tests:
          - accepted_values:
              values: ['no_value', 'low_value', 'medium_value', 'high_value']

version: 2
sources:
  - name: sales_platform
    description: "Raw data from the sales platform system containing customer, order, and payment 
information"
    database: mdlpoclanding_catalog
    schema: raw
    
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    
    loaded_at_field: _loaded_at
    
    tables:
      - name: customers
        description: "Raw customer data including demographic and contact information"
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        
      - name: orders
        description: "Raw order transactions with order details and status"
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        
      - name: payments
        description: "Raw payment records associated with orders"
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
